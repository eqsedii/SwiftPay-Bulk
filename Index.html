<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swift Pay Bulk — Collo Data Solutions</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <div class="logo">
        <span class="logo-mark">S</span>
        <span class="logo-text">SWIFT PAY BULK</span>
      </div>
      <nav class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">About Us</a>
        <a href="#">How it Works</a>
        <a href="#">FAQs</a>
        <a href="#">Contact Us</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <img class="hero-bg" src="hero.png" alt="Collo Data Solutions" />
  </section>

  <section class="badges">
    <div class="badge"><span class="icon">🛡️</span> FAST</div>
    <div class="badge"><span class="icon">🔒</span> SECURE</div>
    <div class="badge"><span class="icon">👍</span> AFFORDABLE</div>
    <div class="badge badge-red">24/7 SERVICE</div>
  </section>

  <main class="form-card">
    <h1>Buy Airtime Now</h1>

    <form id="airtime-form">
      <label for="payerPhone">Mpesa Number</label>
      <div class="input-wrap">
        <span class="input-icon">📞</span>
        <input type="tel" id="payerPhone" placeholder="07XXXXXXXX" required />
      </div>

      <label for="recipientPhone">Number to receive airtime</label>
      <div class="input-wrap">
        <span class="input-icon">📞</span>
        <input type="tel" id="recipientPhone" placeholder="07XXXXXXXX" required />
      </div>

      <label for="amount">Airtime Amount (KES)</label>
      <div class="input-wrap">
        <span class="input-icon">🪙</span>
        <input type="number" id="amount" min="5" placeholder="Enter amount" required />
        <span class="input-suffix">KES</span>
      </div>

      <div id="quote" class="quote"></div>

      <label class="checkbox-row">
        <input type="checkbox" id="terms" required />
        <span>I agree to the <a href="#">terms and conditions</a></span>
      </label>

      <div class="recaptcha-box">
        <label class="checkbox-row">
          <input type="checkbox" id="notRobot" required />
          <span>I'm not a robot</span>
        </label>
        <div class="recaptcha-badge">reCAPTCHA<br /><small>Privacy · Terms</small></div>
      </div>

      <div id="form-message" class="form-message"></div>

      <button type="submit" id="pay-btn" class="pay-btn">Pay</button>
    </form>
  </main>

  <footer class="footer">
    <div class="footer-left">🛡️ Always here for you</div>
    <div class="footer-right">
      <div class="footer-brand">SWIFT PAY BULK</div>
      <div class="footer-tag">Fast • Easy • Reliable</div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
                         </html>
